server.port=8080

# Test Database Configuration (H2 in-memory PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:reaction_challenge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.region=test-region
server.id=test-server
global.accelerator.enabled=false
cors.origins=http://localhost:5173
